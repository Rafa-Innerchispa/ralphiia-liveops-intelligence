services:
  - type: web
    name: ralphiia-liveops-intelligence
    runtime: python
    region: oregon
    plan: free
    branch: hackathon/youcom-liveops-20260724
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DEPLOY_SURFACE
        value: render
      - key: LIVEOPS_DATA_MODE
        value: auto
      - key: LIVEOPS_WHATSAPP_NOTIFY
        value: "false"
      - key: YOUCOM_TRANSPORT
        value: mcp
      # Set in Render Dashboard (never commit values):
      # YOUCOM_API_KEY, PARASAIL_API_KEY, ONE_SECRET, ONE_GITHUB_CONNECTION_KEY,
      # GITHUB_REPO_OWNER, GITHUB_REPO_NAME,
      # RALFIA_STATUS_URL, RALFIA_STATUS_TOKEN, CF_ACCESS_* (read-only bridge)
